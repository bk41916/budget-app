<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的記帳本</title>

<!-- PWA: iOS Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="記帳本">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2d5a3d">
<meta name="description" content="個人多帳戶記帳 APP">

<!-- apple-touch-icon 用 JS 動態產生 PNG，iOS 才認得 -->
<script>
(function(){
  try {
    var c = document.createElement('canvas');
    c.width = c.height = 180;
    var ctx = c.getContext('2d');
    var r = 36;
    ctx.beginPath();
    ctx.moveTo(r,0); ctx.lineTo(180-r,0);
    ctx.quadraticCurveTo(180,0,180,r);
    ctx.lineTo(180,180-r);
    ctx.quadraticCurveTo(180,180,180-r,180);
    ctx.lineTo(r,180);
    ctx.quadraticCurveTo(0,180,0,180-r);
    ctx.lineTo(0,r);
    ctx.quadraticCurveTo(0,0,r,0);
    ctx.closePath();
    ctx.fillStyle = '#2d5a3d';
    ctx.fill();
    ctx.font = '100px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💰', 90, 95);
    var png = c.toDataURL('image/png');
    var l = document.createElement('link');
    l.rel = 'apple-touch-icon';
    l.href = png;
    document.head.appendChild(l);
    var l2 = document.createElement('link');
    l2.rel = 'icon'; l2.type = 'image/png'; l2.href = png;
    document.head.appendChild(l2);
  } catch(e){}
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #f5f3ef;
    --surface: #ffffff;
    --surface2: #f9f7f4;
    --border: #e8e3da;
    --text: #1a1816;
    --text2: #6b6560;
    --text3: #a09a93;
    --accent: #2d5a3d;
    --accent-light: #e8f0eb;
    --danger: #c0392b;
    --danger-light: #fdf0ee;
    --income: #1a6b3c;
    --income-light: #eaf5ee;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ── Header ── */
  header {
    background: var(--accent);
    color: white;
    padding: 0 24px;
    padding-top: env(safe-area-inset-top);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    height: calc(56px + env(safe-area-inset-top));
    padding-bottom: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.5px; }
  header .month-nav { display: flex; align-items: center; gap: 8px; }
  header .month-nav button {
    background: rgba(255,255,255,0.15);
    border: none; color: white;
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  header .month-nav button:hover { background: rgba(255,255,255,0.25); }
  #current-month { font-size: 15px; font-weight: 500; min-width: 80px; text-align: center; }

  /* ── Nav tabs ── */
  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    overflow-x: auto;
    padding: 0 16px;
  }
  nav button {
    border: none; background: none;
    padding: 14px 16px 12px;
    font-size: 14px; font-weight: 500;
    color: var(--text2);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
  }
  nav button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  nav button:hover:not(.active) { color: var(--text); }

  /* ── Main layout ── */
  main { max-width: 780px; margin: 0 auto; padding: 20px 16px 80px; }

  .page { display: none; }
  .page.active { display: block; }

  /* ── Summary cards ── */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .summary-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .summary-card .label { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
  .summary-card .amount { font-size: 20px; font-weight: 600; }
  .summary-card.income .amount { color: var(--income); }
  .summary-card.expense .amount { color: var(--danger); }

  /* ── Account cards ── */
  .accounts-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .account-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    border-left: 4px solid #ccc;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .account-card:hover { transform: translateY(-1px); }
  .account-card .acc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .account-card .acc-name { font-size: 14px; font-weight: 600; }
  .account-card .acc-icon { font-size: 22px; }
  .account-card .acc-balance { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .account-card .acc-budget { font-size: 12px; color: var(--text2); }
  .account-card .progress-bar {
    height: 4px; background: var(--border);
    border-radius: 2px; margin-top: 10px; overflow: hidden;
  }
  .account-card .progress-fill {
    height: 100%; border-radius: 2px;
    transition: width 0.3s;
  }
  .account-card .acc-used { font-size: 12px; color: var(--text2); margin-top: 4px; }

  /* ── Section headers ── */
  .section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .section-header h2 { font-size: 15px; font-weight: 600; }

  /* ── Transaction list ── */
  .tx-list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .tx-item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .tx-item:last-child { border-bottom: none; }
  .tx-item:hover { background: var(--surface2); }
  .tx-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .tx-info { flex: 1; min-width: 0; }
  .tx-info .tx-desc { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-info .tx-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .tx-right { text-align: right; flex-shrink: 0; }
  .tx-amount { font-size: 15px; font-weight: 600; }
  .tx-amount.expense { color: var(--danger); }
  .tx-amount.income { color: var(--income); }
  .tx-date { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .tx-delete {
    background: none; border: none;
    color: var(--text3); cursor: pointer;
    padding: 4px; border-radius: 6px;
    font-size: 14px; opacity: 0;
    transition: opacity 0.1s;
  }
  .tx-item:hover .tx-delete { opacity: 1; }
  .tx-delete:hover { color: var(--danger); background: var(--danger-light); }
  .empty-state { padding: 40px; text-align: center; color: var(--text3); font-size: 14px; }

  /* ── FAB ── */
  .fab {
    position: fixed; bottom: calc(28px + env(safe-area-inset-bottom)); right: 24px;
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--accent); color: white;
    border: none; font-size: 26px;
    cursor: pointer; box-shadow: 0 4px 16px rgba(45,90,61,0.35);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .fab:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(45,90,61,0.45); }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 300;
    display: none; align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    width: 100%; max-width: 780px;
    padding: 24px 20px 32px;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } }
  .modal h2 { font-size: 17px; font-weight: 600; margin-bottom: 20px; }
  .modal .close-btn {
    position: absolute; right: 20px; top: 20px;
    background: var(--surface2); border: none;
    width: 30px; height: 30px; border-radius: 50%;
    cursor: pointer; font-size: 16px; color: var(--text2);
  }

  /* ── Form fields ── */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px; color: var(--text);
    background: var(--surface);
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }

  .type-toggle {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; margin-bottom: 14px;
  }
  .type-btn {
    padding: 10px; border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface); cursor: pointer;
    font-size: 14px; font-weight: 500;
    color: var(--text2);
    transition: all 0.15s;
  }
  .type-btn.active.expense { border-color: var(--danger); background: var(--danger-light); color: var(--danger); }
  .type-btn.active.income { border-color: var(--income); background: var(--income-light); color: var(--income); }

  .submit-btn {
    width: 100%; padding: 13px;
    background: var(--accent); color: white;
    border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600;
    cursor: pointer; margin-top: 6px;
    transition: background 0.15s;
  }
  .submit-btn:hover { background: #224a31; }

  /* ── Category chips ── */
  .cat-grid {
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 8px; margin-top: 6px;
  }
  .cat-chip {
    padding: 8px 4px; border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface); cursor: pointer;
    text-align: center; font-size: 11px;
    color: var(--text2);
    transition: all 0.12s;
  }
  .cat-chip .emoji { display: block; font-size: 20px; margin-bottom: 3px; }
  .cat-chip.selected { border-color: var(--accent); background: var(--accent-light); color: var(--accent); font-weight: 500; }

  /* ── Charts ── */
  .chart-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; color: var(--text); }
  .chart-wrap { position: relative; }

  /* ── Settings ── */
  .settings-section { margin-bottom: 24px; }
  .settings-section h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; font-size: 12px; }
  .settings-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .settings-row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-row .row-icon { font-size: 20px; width: 32px; text-align: center; }
  .settings-row .row-info { flex: 1; }
  .settings-row .row-info .row-label { font-size: 14px; font-weight: 500; }
  .settings-row .row-info .row-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .settings-row input[type="number"] {
    width: 100px; padding: 6px 10px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; text-align: right; outline: none;
  }
  .settings-row input:focus { border-color: var(--accent); }
  .save-badge {
    display: inline-block; background: var(--income-light); color: var(--income);
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
    opacity: 0; transition: opacity 0.3s;
  }
  .save-badge.show { opacity: 1; }

  /* ── Date group headers ── */
  .date-group-header {
    padding: 8px 16px 4px;
    font-size: 12px; font-weight: 600;
    color: var(--text3); letter-spacing: 0.3px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  /* ── Account management ── */
  .acc-manage-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .acc-manage-row:last-child { border-bottom: none; }
  .acc-color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .acc-manage-row .row-info { flex: 1; }
  .acc-manage-row .row-label { font-size: 14px; font-weight: 500; }
  .acc-manage-row .row-sub { font-size: 12px; color: var(--text2); margin-top: 1px; }
  .icon-btn {
    background: none; border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 10px;
    cursor: pointer; font-size: 13px; color: var(--text2);
    transition: all 0.12s;
  }
  .icon-btn:hover { background: var(--surface2); color: var(--text); }
  .icon-btn.danger:hover { background: var(--danger-light); color: var(--danger); border-color: var(--danger); }
  .add-acc-btn {
    width: 100%; padding: 12px;
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    background: none; cursor: pointer;
    color: var(--text2); font-size: 14px;
    margin-top: 10px;
    transition: all 0.15s;
  }
  .add-acc-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  /* ── Emoji picker ── */
  .emoji-grid {
    display: grid; grid-template-columns: repeat(8, 1fr);
    gap: 6px; margin-top: 6px;
  }
  .emoji-opt {
    font-size: 22px; text-align: center;
    padding: 6px 2px; border-radius: 8px;
    cursor: pointer; border: 1.5px solid transparent;
    transition: all 0.1s;
  }
  .emoji-opt:hover { background: var(--surface2); }
  .emoji-opt.selected { border-color: var(--accent); background: var(--accent-light); }

  /* ── Color picker ── */
  .color-grid {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px;
  }
  .color-opt {
    width: 28px; height: 28px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
    transition: transform 0.1s;
  }
  .color-opt:hover { transform: scale(1.15); }
  .color-opt.selected { border-color: var(--text); transform: scale(1.15); }

  /* ── Account detail drawer ── */
  .drawer-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 300;
    display: none; align-items: flex-end; justify-content: center;
  }
  .drawer-overlay.open { display: flex; }
  .drawer {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    width: 100%; max-width: 780px;
    max-height: 85vh;
    display: flex; flex-direction: column;
    animation: slideUp 0.2s ease;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .drawer-header {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .drawer-header .drawer-icon { font-size: 26px; }
  .drawer-header .drawer-title { font-size: 17px; font-weight: 600; flex: 1; }
  .drawer-header .drawer-close {
    background: var(--surface2); border: none;
    width: 30px; height: 30px; border-radius: 50%;
    cursor: pointer; font-size: 16px; color: var(--text2);
  }
  .drawer-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1px; background: var(--border);
    flex-shrink: 0;
  }
  .drawer-stat {
    background: var(--surface2);
    padding: 12px 14px; text-align: center;
  }
  .drawer-stat .ds-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
  .drawer-stat .ds-value { font-size: 16px; font-weight: 600; }
  .drawer-body { overflow-y: auto; flex: 1; }
  .day-section { }
  .day-header {
    padding: 10px 16px 4px;
    font-size: 12px; font-weight: 600;
    color: var(--text3); letter-spacing: 0.3px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .day-header .day-total { font-size: 12px; color: var(--text2); }
  .account-card { cursor: pointer; }
  .account-card:active { transform: scale(0.98); }

  @media (max-width: 480px) {
    .summary-grid { grid-template-columns: 1fr 1fr; }
    .summary-grid .summary-card:last-child { grid-column: span 2; }
    .accounts-grid { grid-template-columns: 1fr; }
    .cat-grid { grid-template-columns: repeat(5, 1fr); }
  }
</style>
</head>
<body>

<header>
  <h1>💰 我的記帳本</h1>
  <div class="month-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <span id="current-month"></span>
    <button onclick="changeMonth(1)">›</button>
  </div>
</header>

<nav>
  <button class="active" onclick="showPage('home', this)">總覽</button>
  <button onclick="showPage('transactions', this)">交易記錄</button>
  <button onclick="showPage('stats', this)">統計圖表</button>
  <button onclick="showPage('settings', this)">帳戶設定</button>
</nav>

<main>
  <!-- ── 總覽 ── -->
  <div id="page-home" class="page active">
    <div class="summary-grid" id="summary-grid"></div>
    <div class="section-header">
      <h2>各帳戶餘額</h2>
    </div>
    <div class="accounts-grid" id="accounts-grid"></div>
    <div class="section-header">
      <h2>近期交易</h2>
    </div>
    <div class="tx-list" id="recent-list"></div>
  </div>

  <!-- ── 交易記錄 ── -->
  <div id="page-transactions" class="page">
    <div class="tx-list" id="all-tx-list"></div>
  </div>

  <!-- ── 統計 ── -->
  <div id="page-stats" class="page">
    <div class="chart-card">
      <h3>本月支出分類</h3>
      <div class="chart-wrap" style="height:260px"><canvas id="pieChart" role="img" aria-label="本月支出分類圓餅圖">支出分類統計</canvas></div>
    </div>
    <div class="chart-card">
      <h3>各帳戶使用率</h3>
      <div class="chart-wrap" style="height:220px"><canvas id="barChart" role="img" aria-label="各帳戶預算使用率長條圖">帳戶使用率</canvas></div>
    </div>
    <div class="chart-card">
      <h3>近6個月支出趨勢</h3>
      <div class="chart-wrap" style="height:220px"><canvas id="lineChart" role="img" aria-label="近6個月支出折線圖">支出趨勢</canvas></div>
    </div>
  </div>

  <!-- ── 設定 ── -->
  <div id="page-settings" class="page">
    <div class="settings-section">
      <h2>帳戶管理</h2>
      <div class="settings-card" id="acc-manage-list"></div>
      <button class="add-acc-btn" onclick="openAccModal()">＋ 新增帳戶</button>
    </div>
    <div class="settings-section">
      <h2>固定收支</h2>
      <div class="settings-card" id="recurring-list"></div>
      <button class="add-acc-btn" onclick="openRecurringModal()">＋ 新增固定收支</button>
      <div id="apply-recurring-wrap" style="margin-top:10px;display:none">
        <button onclick="applyRecurring()" style="width:100%;padding:12px;border-radius:var(--radius);border:none;background:var(--accent);color:white;font-size:14px;font-weight:600;cursor:pointer;">套用固定收支到本月</button>
        <p style="font-size:12px;color:var(--text3);margin-top:6px;text-align:center" id="apply-status-text">尚未套用本月 · 點擊後自動建立交易記錄</p>
      </div>
    </div>
    <div class="settings-section">
      <h2>每月預算設定</h2>
      <div class="settings-card" id="budget-settings"></div>
    </div>
    <div class="settings-section">
      <h2>資料管理</h2>
      <div class="settings-card">
        <div class="settings-row">
          <span class="row-icon">📤</span>
          <div class="row-info">
            <div class="row-label">匯出資料</div>
            <div class="row-sub">下載 JSON 備份檔案</div>
          </div>

<script>
// ═══════════════════════════════════════════
// DATA MODEL
// ═══════════════════════════════════════════
const DEFAULT_ACCOUNTS = [
  { id: 'life',    name: '生活帳戶', icon: '🏠', color: '#2d5a3d', defaultBudget: 8000 },
  { id: 'edu',     name: '教育帳戶', icon: '📚', color: '#1a5276', defaultBudget: 3000 },
  { id: 'fun',     name: '玩樂帳戶', icon: '🎮', color: '#8e44ad', defaultBudget: 3000 },
  { id: 'invest',  name: '投資帳戶', icon: '📈', color: '#d35400', defaultBudget: 5000 },
];

const ACCOUNT_COLORS = [
  '#2d5a3d','#1a5276','#8e44ad','#d35400',
  '#16a085','#c0392b','#2980b9','#f39c12',
  '#6c3483','#117a65','#784212','#1b4f72',
  '#512e5f','#78281f','#145a32','#4a235a',
];

const ACCOUNT_EMOJIS = [
  '🏠','📚','🎮','📈','💊','🚗','✈️','🎵',
  '🍔','👗','💡','🐾','🎁','💰','🏋️','🎨',
  '📱','🔧','🌿','⚽','🎓','🏦','🛒','💼',
];

function getAccounts() {
  const db = load();
  if (!db.accounts || db.accounts.length === 0) {
    return DEFAULT_ACCOUNTS.map(a => ({...a}));
  }
  return db.accounts;
}

function saveAccounts(accounts) {
  const db = load();
  db.accounts = accounts;
  // ensure budgets exist for all accounts
  if (!db.budgets) db.budgets = {};
  accounts.forEach(a => {
    if (db.budgets[a.id] === undefined) db.budgets[a.id] = a.defaultBudget || 0;
  });
  localStorage.setItem('budgetApp', JSON.stringify(db));
}

const CATEGORIES = {
  expense: [
    { id: 'food',      name: '餐飲', emoji: '🍜', account: 'life' },
    { id: 'transport', name: '交通', emoji: '🚌', account: 'life' },
    { id: 'grocery',   name: '購物', emoji: '🛒', account: 'life' },
    { id: 'medical',   name: '醫療', emoji: '💊', account: 'life' },
    { id: 'mortgage',  name: '房貸', emoji: '🏠', account: 'life' },
    { id: 'rent',      name: '房租', emoji: '🔑', account: 'life' },
    { id: 'electric',  name: '電費', emoji: '⚡', account: 'life' },
    { id: 'water',     name: '水費', emoji: '💧', account: 'life' },
    { id: 'gas',       name: '瓦斯', emoji: '🔥', account: 'life' },
    { id: 'phone',     name: '電話費', emoji: '📱', account: 'life' },
    { id: 'insurance', name: '保險費', emoji: '🛡️', account: 'life' },
    { id: 'book',      name: '書籍', emoji: '📖', account: 'edu' },
    { id: 'course',    name: '課程', emoji: '🎓', account: 'edu' },
    { id: 'sub',       name: '訂閱', emoji: '💻', account: 'edu' },
    { id: 'entertain', name: '娛樂', emoji: '🎬', account: 'fun' },
    { id: 'dining',    name: '聚餐', emoji: '🍻', account: 'fun' },
    { id: 'travel',    name: '旅遊', emoji: '✈️', account: 'fun' },
    { id: 'stock',     name: '股票', emoji: '📊', account: 'invest' },
    { id: 'other',     name: '其他', emoji: '📌', account: 'life' },
  ],
  income: [
    { id: 'salary',  name: '薪水',  emoji: '💴', account: 'life' },
    { id: 'bonus',   name: '獎金',  emoji: '🎁', account: 'life' },
    { id: 'invest_r',name: '投資收益',emoji:'📈', account: 'invest' },
    { id: 'other_i', name: '其他',  emoji: '💡', account: 'life' },
  ]
};

// ── Storage helpers ──
function load() {
  try { return JSON.parse(localStorage.getItem('budgetApp') || '{}'); } catch { return {}; }
}
function save(data) { localStorage.setItem('budgetApp', JSON.stringify(data)); }

function getData() {
  const db = load();
  if (!db.transactions) db.transactions = [];
  if (!db.budgets) db.budgets = {};
  const accounts = getAccounts();
  accounts.forEach(a => { if (db.budgets[a.id] === undefined) db.budgets[a.id] = a.defaultBudget || 0; });
  return db;
}

// ── Current month state ──
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth(); // 0-indexed

function monthKey(y, m) { return `${y}-${String(m+1).padStart(2,'0')}`; }
function currentKey() { return monthKey(currentYear, currentMonth); }

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  document.getElementById('current-month').textContent = `${currentYear}/${currentMonth+1}`;
  renderAll();
}

// ── Current type / category selection ──
let selectedType = 'expense';
let selectedCat = 'food';

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function renderAll() {
  renderSummary();
  renderAccounts();
  renderRecentTx();
  renderAllTx();
  renderStats();
  renderBudgetSettings();
  renderAccManageList();
  renderRecurringList();
}

// ═══════════════════════════════════════════
// RECURRING TRANSACTIONS
// ═══════════════════════════════════════════
function getRecurring() {
  const db = load();
  return db.recurring || [];
}

function renderRecurringList() {
  const list = getRecurring();
  const el = document.getElementById('recurring-list');
  const wrapEl = document.getElementById('apply-recurring-wrap');
  if (!el) return;

  if (list.length === 0) {
    el.innerHTML = '<div class="empty-state">尚無固定收支項目</div>';
    if (wrapEl) wrapEl.style.display = 'none';
    return;
  }

  const key = currentKey();
  const db = load();
  const appliedKeys = (db.appliedMonths || []);
  const alreadyApplied = appliedKeys.includes(key);

  if (wrapEl) {
    const enabled = list.filter(r=>r.enabled!==false);
    wrapEl.style.display = enabled.length > 0 ? 'block' : 'none';
    const statusEl = document.getElementById('apply-status-text');
    if (statusEl) {
      if (alreadyApplied) {
        statusEl.textContent = `✓ 本月已套用（${currentYear}/${currentMonth+1}）`;
        statusEl.style.color = 'var(--income)';
      } else {
        statusEl.textContent = `尚未套用本月 · 點擊後自動建立 ${enabled.length} 筆交易記錄`;
        statusEl.style.color = 'var(--text3)';
      }
    }
  }

  const accounts = getAccounts();
  el.innerHTML = list.map(rec => {
    const allCats = [...CATEGORIES.expense, ...CATEGORIES.income];
    const cat = allCats.find(c=>c.id===rec.cat) || {emoji:'📌', name:'其他'};
    const acc = accounts.find(a=>a.id===rec.account) || {name:'－', icon:'💼'};
    const sign = rec.type === 'expense' ? '-' : '+';
    const amtColor = rec.type === 'expense' ? 'var(--danger)' : 'var(--income)';
    const dimmed = rec.enabled === false ? 'opacity:0.45' : '';
    return `
      <div class="acc-manage-row" style="${dimmed}">
        <span style="font-size:20px">${cat.emoji}</span>
        <div class="row-info">
          <div class="row-label">${rec.name}</div>
          <div class="row-sub">${acc.icon} ${acc.name} · 每月 ${rec.day} 號 · ${cat.name}</div>
        </div>
        <span style="font-size:14px;font-weight:600;color:${amtColor};flex-shrink:0">${sign}$${Number(rec.amount).toLocaleString()}</span>
        <button class="icon-btn" onclick="openRecurringModal('${rec.id}')">編輯</button>
        <button class="icon-btn danger" onclick="deleteRecurring('${rec.id}')">刪除</button>
      </div>`;
  }).join('');
}

function applyRecurring() {
  const key = currentKey();
  const db = load();
  if (!db.appliedMonths) db.appliedMonths = [];
  const alreadyApplied = db.appliedMonths.includes(key);

  const list = (db.recurring || []).filter(r=>r.enabled!==false);
  if (list.length === 0) return;

  if (alreadyApplied) {
    // 已套用就直接再套用，不用 confirm（iOS PWA 會封鎖）
  }

  if (!db.transactions) db.transactions = [];
  list.forEach(rec => {
    const day = Math.min(rec.day, 28);
    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    db.transactions.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2),
      type: rec.type,
      amount: rec.amount,
      desc: rec.name,
      cat: rec.cat,
      account: rec.account,
      date: dateStr,
      month: key,
      fromRecurring: true
    });
  });

  if (!db.appliedMonths.includes(key)) db.appliedMonths.push(key);
  localStorage.setItem('budgetApp', JSON.stringify(db));
  renderAll();
  alert(`已套用 ${list.length} 筆固定收支到 ${currentYear}/${currentMonth+1}！`);
}

// ── Recurring Modal ──
let recType = 'expense';
let recCat = 'food';

function openRecurringModal(editId) {
  const modal = document.getElementById('recurring-modal');
  modal.classList.add('open');
  document.getElementById('rec-edit-id').value = editId || '';
  document.getElementById('recurring-modal-title').textContent = editId ? '編輯固定收支' : '新增固定收支';

  if (editId) {
    const rec = getRecurring().find(r=>r.id===editId);
    if (rec) {
      recType = rec.type;
      recCat = rec.cat;
      document.getElementById('rec-name').value = rec.name;
      document.getElementById('rec-amount').value = rec.amount;
      document.getElementById('rec-day').value = rec.day;
      document.getElementById('rec-enabled').checked = rec.enabled !== false;
      setTimeout(()=>{ document.getElementById('rec-account').value = rec.account; }, 50);
    }
  } else {
    recType = 'expense';
    recCat = 'food';
    document.getElementById('rec-name').value = '';
    document.getElementById('rec-amount').value = '';
    document.getElementById('rec-day').value = '1';
    document.getElementById('rec-enabled').checked = true;
  }
  setRecType(recType);
  renderRecAccountSelect();
}

function closeRecurringModal() {
  document.getElementById('recurring-modal').classList.remove('open');
}

function setRecType(type) {
  recType = type;
  document.getElementById('rec-btn-expense').className = 'type-btn' + (type==='expense'?' active expense':'');
  document.getElementById('rec-btn-income').className  = 'type-btn' + (type==='income'?' active income':'');
  const cats = CATEGORIES[type];
  if (!cats.find(c=>c.id===recCat)) recCat = cats[0].id;
  renderRecCatGrid();
  renderRecAccountSelect();
}

function renderRecCatGrid() {
  const cats = CATEGORIES[recType];
  document.getElementById('rec-cat-grid').innerHTML = cats.map(c=>`
    <div class="cat-chip ${c.id===recCat?'selected':''}" onclick="selectRecCat('${c.id}')">
      <span class="emoji">${c.emoji}</span>${c.name}
    </div>`).join('');
}

function selectRecCat(id) {
  recCat = id;
  renderRecCatGrid();
  const cat = [...CATEGORIES.expense,...CATEGORIES.income].find(c=>c.id===id);
  if (cat) {
    const accounts = getAccounts();
    const match = accounts.find(a=>a.id===cat.account);
    const sel = document.getElementById('rec-account');
    if (match) sel.value = match.id;
  }
}

function renderRecAccountSelect() {
  const accounts = getAccounts();
  document.getElementById('rec-account').innerHTML = accounts.map(a=>`<option value="${a.id}">${a.icon} ${a.name}</option>`).join('');
}

function saveRecurring() {
  const name   = document.getElementById('rec-name').value.trim();
  const amount = parseFloat(document.getElementById('rec-amount').value);
  const accId  = document.getElementById('rec-account').value;
  const day    = parseInt(document.getElementById('rec-day').value);
  const enabled = document.getElementById('rec-enabled').checked;
  const editId = document.getElementById('rec-edit-id').value;

  if (!name) { alert('請輸入名稱'); return; }
  if (!amount || amount <= 0) { alert('請輸入金額'); return; }
  if (!day || day < 1 || day > 28) { alert('日期請填 1–28'); return; }

  const db = load();
  if (!db.recurring) db.recurring = [];

  if (editId) {
    const idx = db.recurring.findIndex(r=>r.id===editId);
    if (idx >= 0) db.recurring[idx] = { ...db.recurring[idx], name, amount, type: recType, cat: recCat, account: accId, day, enabled };
  } else {
    db.recurring.push({ id: 'rec_'+Date.now(), name, amount, type: recType, cat: recCat, account: accId, day, enabled });
  }

  localStorage.setItem('budgetApp', JSON.stringify(db));
  closeRecurringModal();
  renderRecurringList();
}

function deleteRecurring(id) {
  const db = load();
  db.recurring = (db.recurring||[]).filter(r=>r.id!==id);
  localStorage.setItem('budgetApp', JSON.stringify(db));
  renderRecurringList();
}

function formatMoney(n) {
  return '$' + Math.abs(n).toLocaleString();
}

// ── Summary ──
function renderSummary() {
  const db = getData();
  const key = currentKey();
  const txs = db.transactions.filter(t => t.month === key);
  const totalIncome  = txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const totalExpense = txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const net = totalIncome - totalExpense;
  document.getElementById('summary-grid').innerHTML = `
    <div class="summary-card income">
      <div class="label">本月收入</div>
      <div class="amount">${formatMoney(totalIncome)}</div>
    </div>
    <div class="summary-card expense">
      <div class="label">本月支出</div>
      <div class="amount">${formatMoney(totalExpense)}</div>
    </div>
    <div class="summary-card">
      <div class="label">結餘</div>
      <div class="amount" style="color:${net>=0?'var(--income)':'var(--danger)'}">${net>=0?'+':''}${formatMoney(net)}</div>
    </div>
  `;
}

// ── Accounts ──
function renderAccounts() {
  const db = getData();
  const key = currentKey();
  const txs = db.transactions.filter(t => t.month === key && t.type === 'expense');
  const accounts = getAccounts();

  document.getElementById('accounts-grid').innerHTML = accounts.map(acc => {
    const budget = db.budgets[acc.id] || 0;
    const spent  = txs.filter(t=>t.account===acc.id).reduce((s,t)=>s+t.amount,0);
    const remain = budget - spent;
    const pct    = budget > 0 ? Math.min(100, Math.round(spent/budget*100)) : 0;
    const danger = pct >= 90;
    const warn   = pct >= 70;
    const fillColor = danger ? '#c0392b' : warn ? '#e67e22' : acc.color;
    return `
      <div class="account-card" style="border-left-color:${acc.color}" onclick="openAccDrawer('${acc.id}')">
        <div class="acc-header">
          <div class="acc-name">${acc.name}</div>
          <div class="acc-icon">${acc.icon}</div>
        </div>
        <div class="acc-balance" style="color:${remain<0?'var(--danger)':acc.color}">${formatMoney(remain)}</div>
        <div class="acc-budget">月預算 ${formatMoney(budget)}</div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${pct}%;background:${fillColor}"></div>
        </div>
        <div class="acc-used">已用 ${formatMoney(spent)}（${pct}%）</div>
      </div>`;
  }).join('');
}

// ── Transaction list builder ──
function buildTxHTML(txs, limit) {
  if (!txs.length) return '<div class="empty-state">本月尚無交易記錄</div>';
  const sorted = [...txs].sort((a,b)=>b.date.localeCompare(a.date));
  const list = limit ? sorted.slice(0, limit) : sorted;
  let lastDate = '';
  let html = '';
  list.forEach(tx => {
    const cat = [...CATEGORIES.expense, ...CATEGORIES.income].find(c=>c.id===tx.cat) || {emoji:'📌',name:'其他'};
    const acc = getAccounts().find(a=>a.id===tx.account) || {name:'－'};
    const sign = tx.type === 'expense' ? '-' : '+';
    const cls  = tx.type;
    const d = tx.date;
    if (d !== lastDate) {
      html += `<div class="date-group-header">${d}</div>`;
      lastDate = d;
    }
    html += `
      <div class="tx-item">
        <div class="tx-icon" style="background:${tx.type==='expense'?'var(--danger-light)':'var(--income-light)'}">${cat.emoji}</div>
        <div class="tx-info">
          <div class="tx-desc">${tx.desc || cat.name}</div>
          <div class="tx-meta">${cat.name} · ${acc.name}</div>
        </div>
        <div class="tx-right">
          <div class="tx-amount ${cls}">${sign}${formatMoney(tx.amount)}</div>
          <div class="tx-date">${tx.date}</div>
        </div>
        <button class="tx-delete" onclick="deleteTx('${tx.id}')">✕</button>
      </div>`;
  });
  return html;
}

function renderRecentTx() {
  const db = getData();
  const txs = db.transactions.filter(t=>t.month===currentKey());
  document.getElementById('recent-list').innerHTML = buildTxHTML(txs, 8);
}

// ── Account Detail Drawer ──
function openAccDrawer(accId) {
  const db = getData();
  const accounts = getAccounts();
  const acc = accounts.find(a=>a.id===accId);
  if (!acc) return;

  const key = currentKey();
  const allTxs = db.transactions.filter(t=>t.month===key && t.account===accId);
  const expenses = allTxs.filter(t=>t.type==='expense');
  const incomes  = allTxs.filter(t=>t.type==='income');
  const totalExp = expenses.reduce((s,t)=>s+t.amount,0);
  const totalInc = incomes.reduce((s,t)=>s+t.amount,0);
  const budget   = db.budgets[accId] || 0;
  const remain   = budget - totalExp;

  document.getElementById('drawer-icon').textContent = acc.icon;
  document.getElementById('drawer-title').textContent = acc.name;
  document.getElementById('drawer-month').textContent = `${currentYear} 年 ${currentMonth+1} 月`;
  document.getElementById('acc-drawer').dataset.accId = accId;

  document.getElementById('drawer-stats').innerHTML = `
    <div class="drawer-stat">
      <div class="ds-label">月預算</div>
      <div class="ds-value" style="color:${acc.color}">${formatMoney(budget)}</div>
    </div>
    <div class="drawer-stat">
      <div class="ds-label">已支出</div>
      <div class="ds-value" style="color:var(--danger)">${formatMoney(totalExp)}</div>
    </div>
    <div class="drawer-stat">
      <div class="ds-label">剩餘</div>
      <div class="ds-value" style="color:${remain<0?'var(--danger)':acc.color}">${formatMoney(remain)}</div>
    </div>`;

  // group by date
  const sorted = [...allTxs].sort((a,b)=>a.date.localeCompare(b.date));
  const byDate = {};
  sorted.forEach(tx => {
    if (!byDate[tx.date]) byDate[tx.date] = [];
    byDate[tx.date].push(tx);
  });

  let html = '';
  if (Object.keys(byDate).length === 0) {
    html = '<div class="empty-state">本月尚無交易記錄</div>';
  } else {
    Object.keys(byDate).sort().forEach(date => {
      const dayTxs = byDate[date];
      const dayExp = dayTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
      const dayInc = dayTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
      const dayNet = dayInc - dayExp;
      const d = new Date(date + 'T00:00:00');
      const weekdays = ['日','一','二','三','四','五','六'];
      const label = `${d.getMonth()+1}/${d.getDate()}（${weekdays[d.getDay()]}）`;
      html += `<div class="day-header">
        <span>${label}</span>
        <span class="day-total" style="color:${dayNet>=0?'var(--income)':'var(--danger)'}">
          ${dayNet>=0?'+':''}${formatMoney(dayNet)}
        </span>
      </div>`;
      dayTxs.forEach(tx => {
        const cat = [...CATEGORIES.expense,...CATEGORIES.income].find(c=>c.id===tx.cat)||{emoji:'📌',name:'其他'};
        const sign = tx.type==='expense'?'-':'+';
        const cls  = tx.type;
        html += `
          <div class="tx-item">
            <div class="tx-icon" style="background:${tx.type==='expense'?'var(--danger-light)':'var(--income-light)'}">${cat.emoji}</div>
            <div class="tx-info">
              <div class="tx-desc">${tx.desc||cat.name}</div>
              <div class="tx-meta">${cat.name}</div>
            </div>
            <div class="tx-right">
              <div class="tx-amount ${cls}">${sign}${formatMoney(tx.amount)}</div>
            </div>
            <button class="tx-delete" onclick="deleteTx('${tx.id}')">✕</button>
          </div>`;
      });
    });
  }
  document.getElementById('drawer-body').innerHTML = html;
  document.getElementById('acc-drawer').classList.add('open');
}

function closeAccDrawer() {
  document.getElementById('acc-drawer').classList.remove('open');
  document.getElementById('acc-drawer').dataset.accId = '';
}

// ── Charts ──
let pieChart, barChart, lineChart;

function renderStats() {
  const db = getData();
  const key = currentKey();
  const txs = db.transactions.filter(t=>t.month===key && t.type==='expense');

  // pie — category breakdown
  const catMap = {};
  txs.forEach(t => {
    catMap[t.cat] = (catMap[t.cat]||0) + t.amount;
  });
  const catKeys = Object.keys(catMap);
  const catLabels = catKeys.map(k => {
    const c = CATEGORIES.expense.find(x=>x.id===k);
    return c ? `${c.emoji} ${c.name}` : k;
  });
  const catData = catKeys.map(k=>catMap[k]);
  const palette = ['#2d5a3d','#1a5276','#8e44ad','#d35400','#16a085','#c0392b','#f39c12','#2980b9','#27ae60','#7f8c8d','#e74c3c','#9b59b6'];

  if (pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: {
      labels: catLabels,
      datasets: [{ data: catData, backgroundColor: palette.slice(0, catData.length), borderWidth: 2, borderColor: '#fff' }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right', labels: { font:{size:12}, padding:10, boxWidth:12, boxHeight:12 } }
      }
    }
  });

  // bar — account usage
  if (barChart) barChart.destroy();
  const accounts = getAccounts();
  const barLabels = accounts.map(a=>a.name);
  const barSpent  = accounts.map(a=>{
    return txs.filter(t=>t.account===a.id).reduce((s,t)=>s+t.amount,0);
  });
  const barBudget = accounts.map(a=>db.budgets[a.id]||0);
  barChart = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels: barLabels,
      datasets: [
        { label: '已支出', data: barSpent, backgroundColor: accounts.map(a=>a.color+'cc') },
        { label: '預算', data: barBudget, backgroundColor: '#e8e3da', borderColor: '#c8c3ba', borderWidth:1 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { y: { beginAtZero: true, ticks: { callback: v=>'$'+v.toLocaleString() } } },
      plugins: { legend: { labels: { font:{size:12} } } }
    }
  });

  // line — last 6 months
  const months = [];
  const lineData = [];
  for (let i=5; i>=0; i--) {
    let y=currentYear, m=currentMonth-i;
    if(m<0){m+=12;y--;}
    const k=monthKey(y,m);
    const spent = db.transactions.filter(t=>t.month===k&&t.type==='expense').reduce((s,t)=>s+t.amount,0);
    months.push(`${y}/${m+1}`);
    lineData.push(spent);
  }
  if (lineChart) lineChart.destroy();
  lineChart = new Chart(document.getElementById('lineChart'), {
    type: 'line',
    data: {
      labels: months,
      datasets: [{
        label: '每月支出',
        data: lineData,
        borderColor: '#2d5a3d',
        backgroundColor: 'rgba(45,90,61,0.08)',
        fill: true, tension: 0.35,
        pointBackgroundColor: '#2d5a3d', pointRadius: 4
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { y: { beginAtZero: true, ticks: { callback: v=>'$'+v.toLocaleString() } } },
      plugins: { legend: { display: false } }
    }
  });
}

function saveAccount() {
  const name = document.getElementById('acc-name').value.trim();
  const budget = parseFloat(document.getElementById('acc-budget').value) || 0;
  const editId = document.getElementById('acc-edit-id').value;

  if (!name) { alert('請輸入帳戶名稱'); return; }

  const accounts = getAccounts();
  const db = load();
  if (!db.budgets) db.budgets = {};

  if (editId) {
    const idx = accounts.findIndex(a=>a.id===editId);
    if (idx >= 0) {
      accounts[idx] = { ...accounts[idx], name, icon: selectedAccEmoji, color: selectedAccColor };
      db.budgets[editId] = budget;
    }
  } else {
    const newId = 'acc_' + Date.now();
    accounts.push({ id: newId, name, icon: selectedAccEmoji, color: selectedAccColor, defaultBudget: budget });
    db.budgets[newId] = budget;
  }

  db.accounts = accounts;
  localStorage.setItem('budgetApp', JSON.stringify(db));
  closeAccModal();
  renderAll();
  renderAccManageList();
}

function deleteAccount(accId) {
  const accounts = getAccounts();
  const acc = accounts.find(a=>a.id===accId);
  if (!acc) return;
  const db = load();
  db.accounts = accounts.filter(a=>a.id!==accId);
  localStorage.setItem('budgetApp', JSON.stringify(db));
  renderAll();
  renderAccManageList();
}

function updateBudget(accId, val) {
  const db = getData();
  db.budgets[accId] = Number(val);
  save(db);
  renderAccounts();
  renderStats();
  const badge = document.getElementById('badge-'+accId);
  badge.classList.add('show');

}

function openModal() {
  document.getElementById('modal').classList.add('open');
  setType('expense');

function closeModal() { document.getElementById('modal').classList.remove('open'); }

function shiftDate(delta) {
  const input = document.getElementById('f-date');
  // 手動解析避免 iOS 把 YYYY-MM-DD 當 UTC 導致時區偏移
  let d;
  if (input.value) {
    const [y, m, day] = input.value.split('-').map(Number);
    d = new Date(y, m - 1, day);
  } else {
    d = new Date();
  }
  d.setDate(d.getDate() + delta);
  const yy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  input.value = `${yy}-${mm}-${dd}`;
}

function setType(type) {
  selectedType = type;
  document.getElementById('btn-expense').className = 'type-btn' + (type==='expense'?' active expense':'');
  document.getElementById('btn-income').className  = 'type-btn' + (type==='income'?' active income':'');
  renderCatGrid();
  renderAccountSelect();
}

function renderCatGrid() {
  const cats = CATEGORIES[selectedType];
  if (!selectedCat || !cats.find(c=>c.id===selectedCat)) selectedCat = cats[0].id;
  document.getElementById('cat-grid').innerHTML = cats.map(c=>`
    <div class="cat-chip ${c.id===selectedCat?'selected':''}" onclick="selectCat('${c.id}')">
      <span class="emoji">${c.emoji}</span>${c.name}
    </div>`).join('');
}

function selectCat(id) {
  selectedCat = id;
  const cat = [...CATEGORIES.expense,...CATEGORIES.income].find(c=>c.id===id);
  if (cat) {
    const accounts = getAccounts();
    const matchAcc = accounts.find(a=>a.id===cat.account);
    const sel = document.getElementById('f-account');
    if (matchAcc) sel.value = matchAcc.id;
    else if (accounts.length > 0) sel.value = accounts[0].id;
  }
  renderCatGrid();
}

function renderAccountSelect() {
  const accounts = getAccounts();
  document.getElementById('f-account').innerHTML = accounts.map(a=>`<option value="${a.id}">${a.icon} ${a.name}</option>`).join('');
}

function addTransaction() {
  const amount = parseFloat(document.getElementById('f-amount').value);
  const desc   = document.getElementById('f-desc').value.trim();
  const accId  = document.getElementById('f-account').value;
  const date   = document.getElementById('f-date').value;

  if (!amount || amount <= 0) { alert('請輸入金額'); return; }
  if (!date) { alert('請選擇日期'); return; }

  // 手動解析避免 iOS UTC 時區偏移
  const [ty, tm, td] = date.split('-').map(Number);
  const txDate = new Date(ty, tm - 1, td);
  const txMonth = monthKey(txDate.getFullYear(), txDate.getMonth());

  const db = getData();
  db.transactions.push({
    id:      Date.now().toString(36) + Math.random().toString(36).slice(2),
    type:    selectedType,
    amount,
    desc,
    cat:     selectedCat,
    account: accId,
    date,
    month:   txMonth
  });
  save(db);

  // update view month to match transaction
  currentYear  = txDate.getFullYear();
  currentMonth = txDate.getMonth();
  document.getElementById('current-month').textContent = `${currentYear}/${currentMonth+1}`;

  closeModal();
  renderAll();
}

function exportData() {
  const db = getData();
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `記帳本備份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.transactions && Array.isArray(data.transactions)) {
        if (confirm(`確定要匯入 ${data.transactions.length} 筆資料嗎？這將覆蓋目前資料。`)) {
          save(data);
          renderAll();
          alert('匯入成功！');
        }
      } else {
        alert('格式不正確');
      }
    } catch { alert('讀取失敗，請確認檔案格式'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

  const db = getData();
